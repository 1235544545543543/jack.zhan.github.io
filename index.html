<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jack 英语伙伴 — 专为孩子设计的免费在线英语对话工具，支持语音识别与主动反问">
    <title>Jack 英语伙伴 · 免费在线网站</title>
    <!-- ✅ Tailwind via CDN (no build step) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#4f46e5', 'bg-gradient': 'linear-gradient(135deg, #a0d2eb, #f6d365)' }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        body {
            font-family: 'Noto Sans SC', 'Segoe UI', sans-serif;
            background: var(--tw-gradient-stops);
        }

        .msg-user {
            background-color: #4f46e5;
        }

        .msg-bot {
            background-color: #e0e7ff;
        }
    </style>
</head>

<body class="min-h-screen p-4 pb-24">
    <div class="max-w-2xl mx-auto">
        <header class="text-center mb-4">
            <h1 class="text-2xl md:text-3xl font-bold text-indigo-900">🗣️ Jack 英语伙伴</h1>
            <p class="text-indigo-700 mt-1">🌐 免费在线网站 · 无需下载 · 开箱即用</p>
        </header>

        <div id="chat"
            class="bg-white/90 rounded-2xl shadow-lg h-[50vh] overflow-y-auto p-4 mb-4 border border-indigo-100">
            <div id="msgs" class="space-y-4"></div>
            <div id="loading" class="flex items-center justify-center py-4 hidden">
                <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-indigo-600"></div>
                <span class="ml-2 text-indigo-600">Jack 正在思考中…</span>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 mb-4">
            <button id="mic-btn"
                class="flex-1 px-5 py-3 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M7 4a3 3 0 013-3h4a3 3 0 013 3v12a1 1 0 11-2 0V4a1 1 0 00-1-1H8a1 1 0 00-1 1v12a1 1 0 11-2 0V4zm5 6a3 3 0 100-6 3 3 0 000 6zm-3 9a3 3 0 110-6 3 3 0 010 6z"
                        clip-rule="evenodd" />
                </svg>
                <span id="mic-text">🎤 开始说话</span>
            </button>
            <div class="flex-1 relative">
                <input id="inp" type="text" placeholder="或输入文字..."
                    class="w-full px-4 py-3 rounded-xl border-2 border-indigo-200 focus:border-indigo-500 outline-none"
                    autocomplete="off">
                <button id="send-btn"
                    class="absolute right-2 top-1/2 -translate-y-1/2 bg-indigo-100 text-indigo-700 p-1.5 rounded-lg hover:bg-indigo-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V19a1 1 0 001 1v-3.571a1 1 0 00-.725-.962l-5-1.428a1 1 0 00-.771.725L1 16a1 1 0 001.17 1.408l7-14z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ✅ 【核心】儿童容错修复器（轻量正则，离线运行）
        function fixChildEnglish(input) {
            let txt = input.trim();
            if (!txt) return txt;
            txt = txt.replace(/\bwhat\s+your\s+name\b[^\w]*/i, 'what is your name');
            txt = txt.replace(/\bhow\s+you\s+are\b[^\w]*/i, 'how are you');
            txt = txt.replace(/\bi\s+like\s+apple\b([^\w]|$)/i, 'I like apples$1');
            txt = txt.replace(/\bi\s+go\s+school\b([^\w]|$)/i, 'I go to school$1');
            txt = txt.replace(/\bmy\s+name\s+(\w+)/i, 'my name is $1');
            txt = txt.replace(/\bi\s+am\s+fine\s+thank\b([^\w]|$)/i, 'I am fine, thank you$1');
            txt = txt.charAt(0).toUpperCase() + txt.slice(1);
            if (!/[.?!]$/g.test(txt)) txt += '?';
            return txt;
        }

        // ✅ 添加消息（带延迟）
        function addMsg(text, isUser = false, delay = 0) {
            setTimeout(() => {
                const msgs = document.getElementById('msgs');
                const div = document.createElement('div');
                div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} mb-3`;
                const bubble = document.createElement('div');
                bubble.className = `px-4 py-2.5 rounded-2xl max-w-[85%] text-sm leading-relaxed ${isUser ? 'msg-user text-white' : 'msg-bot text-indigo-800'
                    }`;
                bubble.textContent = text;
                div.appendChild(bubble);
                msgs.appendChild(div);
                msgs.scrollTop = msgs.scrollHeight;
            }, delay);
        }

        // ✅ 规则引擎（主逻辑，WASM 失败时兜底）
        function getRuleReply(input) {
            const txt = input.trim().toLowerCase();
            if (/^(what is your name|what['’]?s your name)/.test(txt)) return "I'm Jack! 🤝 What's your name?";
            if (/^(how are you|how['’]?s it going|how['’]?re you)/.test(txt)) return "I'm great! 😄 How about you?";
            if (/^(my name is|i['’]?m|i am)\s+(\w+)/.test(txt)) {
                const name = txt.match(/(?:my name is|i['’]?m|i am)\s+(\w+)/i)[1];
                return `Nice to meet you, ${name}! 🌟 What's your favorite animal?`;
            }
            if (/^bye|goodbye/.test(txt)) return "Bye-bye! 👋 See you next time!";
            return ["Great job!", "Wow!", "Awesome!"][Math.floor(Math.random() * 3)] + " 🌟 What's next?";
        }

        // ✅ AI 推理（带 fallback）
        async function generateReply(input) {
            try {
                // ✅ 尝试加载 WASM 模型（Xenova transformers）
                const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.19.0?module');
                const model = await pipeline('text-generation', 'Xenova/tinyllama-1.1b-chat', {
                    quantized: true,
                    revision: 'main'
                });

                const output = await model(`You are Jack, a friendly English tutor for children. Always respond in simple English and end with a question.\n\nUser: ${input}\nJack:`, {
                    max_new_tokens: 60,
                    temperature: 0.85
                });

                let reply = output[0].generated_text.trim();
                reply = reply.replace(new RegExp(`.*?${input}\\s*\\nJack:\\s*`, 'is'), '').trim();
                reply = reply.replace(/^Jack:\s*/i, '').trim();
                if (!reply.endsWith('?') && !reply.includes('?')) reply += ' What else would you like to talk about?';
                return reply;

            } catch (e) {
                console.warn('⚠️ WASM 加载失败，启用规则引擎:', e.message);
                return getRuleReply(input);
            }
        }

        // ✅ 语音识别初始化
        function initSpeech() {
            const micBtn = document.getElementById('mic-btn');
            const micText = document.getElementById('mic-text');
            const inp = document.getElementById('inp');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                micBtn.disabled = true;
                micText.textContent = '🚫 不支持';
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = async (e) => {
                const transcript = e.results[0][0].transcript.trim();
                if (!transcript) return;
                const fixed = fixChildEnglish(transcript);
                addMsg(transcript, true);
                addMsg(`📝 修复后：${fixed}`, false, 300);
                const reply = await generateReply(fixed);
                addMsg(reply, false, 600);
            };

            recognition.onerror = (e) => {
                console.error('Speech error:', e.error);
                addMsg(`⚠️ 语音识别失败：${e.error}`, false, 300);
            };

            micBtn.addEventListener('click', () => {
                if (recognition.state === 'listening') {
                    recognition.stop();
                    micText.textContent = '🎤 开始说话';
                } else {
                    recognition.start();
                    micText.textContent = '🔴 正在收听...';
                }
            });

            // 文本发送
            document.getElementById('send-btn').addEventListener('click', async () => {
                const text = inp.value.trim();
                if (!text) return;
                const fixed = fixChildEnglish(text);
                addMsg(text, true);
                addMsg(`📝 修复后：${fixed}`, false, 300);
                const reply = await generateReply(fixed);
                addMsg(reply, false, 600);
                inp.value = '';
            });
            inp.addEventListener('keypress', e => e.key === 'Enter' && document.getElementById('send-btn').click());
        }

        // ✅ 启动
        document.addEventListener('DOMContentLoaded', initSpeech);
    </script>
</body>

</html>
